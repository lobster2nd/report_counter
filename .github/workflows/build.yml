name: Build App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: ReportApp-Windows
            build_target: windows
            icon_file: icon.ico
          - os: ubuntu-latest
            artifact_name: ReportApp-Linux
            build_target: linux
            icon_file: icon.ico
          - os: macos-latest
            artifact_name: ReportApp-MacOS
            build_target: macos
            icon_file: icon.icns

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
           pyinstaller --onefile --windowed --name "Xray_report" --icon="${{ matrix.icon_file }}" main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
          if-no-files-found: error